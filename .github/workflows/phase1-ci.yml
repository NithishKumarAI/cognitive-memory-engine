name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: phase1
          POSTGRES_PASSWORD: phase1-test-only
          POSTGRES_DB: cme_phase1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phase1 -d cme_phase1_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - run: python -m pip install -r backend/requirements-test.txt
      - name: Enable vector in disposable CI service
        env:
          PGPASSWORD: phase1-test-only
        run: psql -h 127.0.0.1 -U phase1 -d cme_phase1_test -c 'CREATE EXTENSION vector'
      - run: python -m pytest -q
        working-directory: backend
        env:
          PHASE1_TEST_DATABASE_URL: postgresql+psycopg://phase1:phase1-test-only@127.0.0.1:5432/cme_phase1_test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
