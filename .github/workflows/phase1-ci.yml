name: Product verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: phase1
          POSTGRES_PASSWORD: phase1-test-only
          POSTGRES_DB: cme_phase1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phase1 -d cme_phase1_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - run: python -m pip install -r backend/requirements-test.txt
      - name: Initialize isolated demo test database
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://phase1:phase1-test-only@127.0.0.1:5432/cme_phase1_test", autocommit=True) as connection:
              connection.execute("CREATE DATABASE cme_verification_demo")
          PY
      - run: python -m pytest -q
        working-directory: backend
        env:
          PHASE1_TEST_DATABASE_URL: postgresql+psycopg://phase1:phase1-test-only@127.0.0.1:5432/cme_phase1_test
          PHASE_DEMO_TEST_DATABASE_URL: postgresql+psycopg://phase1:phase1-test-only@127.0.0.1:5432/cme_verification_demo
  frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: phase1
          POSTGRES_PASSWORD: phase1-test-only
          POSTGRES_DB: cme_phase1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phase1 -d cme_phase1_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - run: python -m pip install -r ../backend/requirements-test.txt
      - run: npm ci
      - run: npm run test:release
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8100
          ALLOW_LOCAL_API_ORIGIN: '1'
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_PYTHON: python
          E2E_PRODUCTION: '1'
          E2E_ARTIFACT_DIR: ../test-artifacts/v1
          PHASE4_E2E_DATABASE_URL: postgresql+psycopg://phase1:phase1-test-only@127.0.0.1:5432/cme_phase1_test
      - name: Initialize isolated demo browser database
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://phase1:phase1-test-only@127.0.0.1:5432/cme_phase1_test", autocommit=True) as connection:
              connection.execute("CREATE DATABASE cme_verification_demo")
          PY
      - name: Build demo edition
        run: npm run build
        env:
          APP_EDITION: demo
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8100
          ALLOW_LOCAL_API_ORIGIN: '1'
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm run test:demo
        env:
          E2E_PYTHON: python
          PHASE_DEMO_TEST_DATABASE_URL: postgresql+psycopg://phase1:phase1-test-only@127.0.0.1:5432/cme_verification_demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1-synthetic-browser-evidence
          path: |
            test-artifacts/v1/screenshots
            test-artifacts/demo-v2/screenshots
            frontend/playwright-report
          retention-days: 7
